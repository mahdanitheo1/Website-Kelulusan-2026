            border: none;

            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;

        .search-btn:hover {
            transform: translateY(-2px);
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lulus {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            color: white;
            animation: celebrate 1s ease-in-out;
        }
        .tidak-lulus {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }
        .loading {
            background: #f0f0f0;
            color: #666;
            font-style: italic;
        }
        .not-found {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .instructions {
            background: #e8f4f8;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #31708f;

        const form = document.getElementById('searchForm');
        const input = document.getElementById('nisnInput');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const nisn = input.value.trim().toUpperCase();
            
            if (!nisn || nisn.length !== 10 || !/^\d{10}$/.test(nisn)) {
                result.textContent = 'NISN tidak valid. Harus 10 digit angka.';
                result.className = 'result not-found';
                return;
            }

            result.textContent = 'Mencari...';
            result.className = 'result loading';

            setTimeout(() => {
                const siswa = siswaData.find(s => s.nisn === nisn);
                
                if (siswa) {
                    const message = siswa.status === 'LULUS' 
                        ? `SELAMAT! ${siswa.nama} \nSTATUS: ${siswa.status}` 
                        : `MOHON MAAF ${siswa.nama} \nSTATUS: ${siswa.status}`;
                    
                    result.innerHTML = message.replace(/\n/g, '<br>');
                    result.className = `result ${siswa.status.toLowerCase().replace(' ', '-')}`;
                } else {
                    result.textContent = 'NISN tidak ditemukan. Periksa kembali atau hubungi pihak sekolah.';
                    result.className = 'result not-found';
                }
            }, 1500);
        });

        // Fokus otomatis
        input.focus();
